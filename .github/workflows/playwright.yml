name: Playwright E2E Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Npm Install
        run: npm install

  test:
    needs: build
    name: Playwright Tests
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'latest'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npm run test

      - name: Upload Smart Report HTML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smart-report-${{ github.run_number }}
          path: tests/smart-report.html
          retention-days: 30
          overwrite: true

      - name: Upload Test History
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-history-${{ github.run_number }}
          path: tests/test-history.json
          retention-days: 30
          overwrite: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ github.run_number }}
          path: test-results
          retention-days: 30
          overwrite: true
