name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: grocerycrud-automation/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./grocerycrud-automation

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./grocerycrud-automation

      - name: Run Playwright tests
        run: npm run test:ci
        working-directory: ./grocerycrud-automation

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: grocerycrud-automation/playwright-report/
          retention-days: 30

      - name: Upload Test Artifacts (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-failed
          path: |
            grocerycrud-automation/test-results/
          retention-days: 30

      - name: Upload All Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: grocerycrud-automation/test-results/
          retention-days: 30
